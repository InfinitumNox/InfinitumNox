<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITUM NOX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #06060a;
            --gold:      #b8952a;
            --gold-dim:  #7a6118;
            --gold-pale: #d4b86a;
            --text:      #bfb49a;
            --text-dim:  #5a5244;
            --text-head: #e8e2d0;
            --border:    #1c1a14;
            --border-hi: #2e2a1e;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 60px 24px 52px;
        }

        /* ── Wordmark ── */
        .wordmark {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 0.82rem;
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: var(--gold);
            text-align: center;
        }

        .wordmark-rule {
            width: 28px;
            height: 1px;
            background: var(--gold-dim);
            opacity: 0.45;
            margin: 22px auto 0;
        }

        /* ── Spacer ── */
        .spacer { flex: 1; }

        /* ── Portal ── */
        .portal {
            width: 100%;
            max-width: 340px;
        }

        .portal-label {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }

        .portal-label::before,
        .portal-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-hi);
        }

        .portal-label span {
            font-size: 0.5rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: var(--gold-dim);
            white-space: nowrap;
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.5rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 9px;
        }

        .form-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-hi);
            padding: 9px 0 9px 2px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 300;
            color: var(--text-head);
            letter-spacing: 0.08em;
            outline: none;
            caret-color: var(--gold);
            transition: border-color 0.3s;
        }

        .form-input::placeholder {
            color: var(--text-dim);
            opacity: 0.4;
        }

        .focus-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 26px 0;
        }

        .form-divider::before,
        .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-hi);
        }

        .form-divider span {
            font-size: 0.45rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0.6;
        }

        .token-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 32px;
        }

        .token-btn {
            background: none;
            border: 1px solid var(--border-hi);
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-size: 0.5rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 9px 12px;
            cursor: pointer;
            transition: border-color 0.25s, color 0.25s;
            white-space: nowrap;
        }

        .token-btn:hover {
            border-color: var(--gold-dim);
            color: var(--gold-pale);
        }

        .btn-submit {
            width: 100%;
            background: none;
            border: 1px solid var(--gold-dim);
            color: var(--gold-pale);
            font-family: 'Inter', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            padding: 15px 24px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color 0.3s, letter-spacing 0.3s;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold-dim);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }

        .btn-submit:hover {
            color: var(--bg);
            letter-spacing: 0.44em;
        }

        .btn-submit:hover::before {
            transform: scaleX(1);
        }

        /* ── Session stamp ── */
        .session-info {
            margin-top: 28px;
            font-size: 0.48rem;
            letter-spacing: 0.2em;
            color: var(--text-dim);
            opacity: 0.35;
            text-align: center;
        }

        @media (max-width: 600px) {
            html, body { overflow: auto; }
            .page { height: auto; min-height: 100vh; padding: 48px 32px 44px; }
        }
    </style>
</head>
<body>

<div class="page">

    <header>
        <div class="wordmark">Infinitum Nox</div>
        <div class="wordmark-rule"></div>
    </header>

    <div class="spacer"></div>

    <section class="portal">

        <div class="portal-label">
            <span>Mandantenportal</span>
        </div>

        <form onsubmit="return false;">

            <div class="form-group">
                <label class="form-label" for="ref">Aktenzeichen</label>
                <input
                    class="form-input"
                    type="text"
                    id="ref"
                    name="ref"
                    placeholder="INX-0000-000000"
                    autocomplete="off"
                    spellcheck="false"
                >
                <div class="focus-line"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="pass">Passwort</label>
                <input
                    class="form-input"
                    type="password"
                    id="pass"
                    name="pass"
                    placeholder="••••••••••••"
                    autocomplete="current-password"
                >
                <div class="focus-line"></div>
            </div>

            <div class="form-divider">
                <span>2FA</span>
            </div>

            <div class="token-row">
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" for="token">Sicherheitstoken</label>
                    <input
                        class="form-input"
                        type="text"
                        id="token"
                        name="token"
                        placeholder="000000"
                        maxlength="6"
                        autocomplete="one-time-code"
                        inputmode="numeric"
                        spellcheck="false"
                    >
                    <div class="focus-line"></div>
                </div>
                <button class="token-btn" type="button">Token</button>
            </div>

            <button class="btn-submit" type="submit">Zugang bestätigen</button>

        </form>

        <p class="session-info" id="session-stamp"></p>

    </section>

</div>

<script>
    const now = new Date();
    const stamp = now.toISOString().replace('T', ' · ').slice(0, 22) + ' UTC';
    document.getElementById('session-stamp').textContent =
        stamp + ' · ' + Math.random().toString(36).slice(2, 10).toUpperCase();

    document.querySelectorAll('.form-input').forEach(input => {
        const line = input.nextElementSibling;
        input.addEventListener('focus', () => { line.style.transform = 'scaleX(1)'; });
        input.addEventListener('blur',  () => { line.style.transform = 'scaleX(0)'; });
    });
</script>

</body>
</html>
