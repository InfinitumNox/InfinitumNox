# Baut die Seite bei jeder Änderung und stellt sie auf GitHub Pages.
# Ergebnis: die Domain, die unten bei SITE_URL steht (aktuell zum
# Testen infinitumnox.com, siehe auch astro.config.mjs).
#
# Einmalig eingeschaltet unter:
#   Repository -> Settings -> Pages -> Source: "GitHub Actions"
#
# Zum Umstellen auf die echte Domain (z. B. mitwachsen.org) reicht es,
# unten SITE_URL zu ändern und in public/CNAME die Domain anzupassen.

name: Vorschau bauen

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt Starten per Knopfdruck auf GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Seite bauen
        uses: withastro/action@v3
        env:
          # Domain für diesen Bau - siehe astro.config.mjs.
          SITE_URL: https://infinitumnox.com
          # Markiert den Bau als Testversion (siehe astro.config.mjs) -
          # sperrt ihn für Suchmaschinen, bis die echte Domain steht.
          # github.repository ist automatisch "benutzername/reponame".
          VORSCHAU_GITHUB: ${{ github.repository }}

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages stellen
        id: pages
        uses: actions/deploy-pages@v4
