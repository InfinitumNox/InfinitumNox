<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinitum Nox · Abmeldung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #040408;
            --bg-2:       #07070d;
            --gold:       #b8952a;
            --gold-dim:   #6b5619;
            --gold-pale:  #cca84e;
            --gold-faint: #2a200a;
            --text-dim:   #4a4438;
            --text-mid:   #7a7060;
            --text-head:  #e2dcc8;
            --text-sub:   #948c78;
            --border:     #1a1710;
            --border-hi:  #2a2518;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 64px 24px 48px;
        }

        /* ─── HEADER ─── */
        .firm-header {
            text-align: center;
            margin-bottom: 52px;
        }

        .firm-name {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 1.05rem;
            letter-spacing: 0.72em;
            text-transform: uppercase;
            color: var(--text-head);
            margin-bottom: 6px;
            padding-right: 0.72em;
        }

        .firm-offices {
            font-size: 0.44rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 18px;
        }

        .firm-rule {
            width: 240px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .firm-rule::before,
        .firm-rule::after {
            content: '';
            flex: 1;
            height: 1px;
        }

        .firm-rule::before { background: linear-gradient(to right, transparent, var(--border-hi)); }
        .firm-rule::after  { background: linear-gradient(to left,  transparent, var(--border-hi)); }

        .firm-rule-diamond {
            width: 5px;
            height: 5px;
            background: var(--gold-dim);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .firm-est {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            color: var(--text-dim);
        }

        /* ─── STATUS ─── */
        .status-block {
            text-align: center;
            margin-bottom: 48px;
        }

        .status-mark {
            font-size: 0.5rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-dim);
            margin-bottom: 12px;
            padding-right: 0.35em;
        }

        .status-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 1.5rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-head);
            margin-bottom: 10px;
            padding-right: 0.22em;
        }

        .status-sub {
            font-size: 0.44rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-dim);
            padding-right: 0.22em;
        }

        /* ─── FINGERPRINTS SECTION ─── */
        .fp-section {
            width: 100%;
            max-width: 480px;
        }

        .fp-section-label {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .fp-section-label::before,
        .fp-section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-hi);
        }

        .fp-section-label span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.78rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: var(--text-sub);
            white-space: nowrap;
            padding-right: 0.38em;
        }

        .fp-hash-block {
            border: 1px solid var(--border-hi);
            padding: 18px 20px;
            margin-bottom: 20px;
        }

        .fp-hash-label {
            font-size: 0.38rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .fp-hash-val {
            font-family: 'Courier New', monospace;
            font-size: 0.52rem;
            letter-spacing: 0.06em;
            color: var(--gold-pale);
            white-space: pre-line;
            line-height: 2.2;
        }

        .fp-components {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .fp-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .fp-row:first-child { border-top: 1px solid var(--border); }

        .fp-key {
            font-size: 0.4rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
            flex-shrink: 0;
            padding-top: 1px;
        }

        .fp-val {
            font-family: 'Courier New', monospace;
            font-size: 0.44rem;
            letter-spacing: 0.04em;
            color: var(--text-mid);
            text-align: right;
            word-break: break-all;
            line-height: 1.9;
        }

        .fp-empty {
            text-align: center;
            padding: 32px 0;
            font-size: 0.44rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* ─── BACK LINK ─── */
        .back-wrap {
            margin-top: 40px;
            text-align: center;
        }

        .back-link {
            font-size: 0.42rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: var(--gold-dim);
            text-decoration: none;
            transition: color 0.3s;
            padding-right: 0.38em;
        }

        .back-link:hover { color: var(--gold-pale); }

        /* ─── FOOTER ─── */
        .page-footer {
            margin-top: 52px;
            text-align: center;
            max-width: 420px;
        }

        .footer-rule {
            width: 60px;
            height: 1px;
            background: var(--border-hi);
            margin: 0 auto 20px;
        }

        .footer-ref {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            color: var(--border-hi);
        }

        @media (max-width: 600px) {
            .page { padding: 48px 20px 40px; }
            .firm-name { font-size: 0.88rem; letter-spacing: 0.55em; }
        }
    </style>
</head>
<body>

<div class="page">

    <header class="firm-header">
        <div class="firm-name">Infinitum Nox</div>
        <div class="firm-offices">Zürich &nbsp;·&nbsp; Frankfurt &nbsp;·&nbsp; London &nbsp;·&nbsp; Singapur</div>
        <div class="firm-rule"><div class="firm-rule-diamond"></div></div>
        <div class="firm-est">Est. MCMXCVIII</div>
    </header>

    <div class="status-block">
        <div class="status-mark">Sitzung beendet</div>
        <div class="status-title">Abmeldung</div>
        <div class="status-sub">Alle Sitzungsdaten wurden sicher terminiert</div>
    </div>

    <section class="fp-section">

        <div class="fp-section-label">
            <span>Fingerprints</span>
        </div>

        <div id="fp-content">
            <div class="fp-empty">Keine Sitzungsdaten vorhanden</div>
        </div>

    </section>

    <div class="back-wrap">
        <a class="back-link" href="/">Zurück zum Portal</a>
    </div>

    <footer class="page-footer">
        <div class="footer-rule"></div>
        <div class="footer-ref">Infinitum Nox &nbsp;·&nbsp; Vertraulich &nbsp;·&nbsp; Alle Rechte vorbehalten</div>
    </footer>

</div>

<script>
(function () {
    var raw = null;
    try { raw = sessionStorage.getItem('inx_fp'); } catch(e) {}

    var container = document.getElementById('fp-content');
    if (!raw) return;

    var data;
    try { data = JSON.parse(raw); } catch(e) { return; }

    var hash = data.hash || '';
    var c    = data.c   || {};
    var ts   = data.ts  || '';

    /* ── Hash block ── */
    var groups = [];
    for (var i = 0; i < 8; i++) groups.push(hash.slice(i * 8, i * 8 + 8));
    var hashLine1 = groups.slice(0, 4).join(' ');
    var hashLine2 = groups.slice(4).join(' ');

    /* ── Timestamp ── */
    var tsDisplay = '—';
    if (ts) {
        try {
            var d = new Date(ts);
            var pad = function(n) { return String(n).padStart(2, '0'); };
            tsDisplay = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate())
                      + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ' UTC';
        } catch(e) {}
    }

    /* ── UA abbreviation ── */
    function truncate(str, n) {
        if (!str) return '—';
        return str.length > n ? str.slice(0, n) + ' …' : str;
    }

    var rows = [
        { key: 'Zeitstempel',       val: tsDisplay },
        { key: 'User-Agent',        val: truncate(c.ua, 72) },
        { key: 'Platform',          val: c.plt  || '—' },
        { key: 'Sprache',           val: c.lng  || '—' },
        { key: 'Zeitzone',          val: c.tz   || '—' },
        { key: 'Auflösung',         val: c.scr  || '—' },
        { key: 'CPU-Kerne',         val: c.hw   ? c.hw + ' Kerne' : '—' },
        { key: 'Pixeldichte',       val: c.pxr  ? (c.pxr / 100).toFixed(2) : '—' },
        { key: 'Canvas-Hash',       val: c.cv   ? truncate(c.cv, 40) : '—' },
        { key: 'WebGL-Renderer',    val: c.gl   ? truncate(c.gl, 56) : '—' },
        { key: 'AudioContext',      val: c.au   ? 'Erfasst (' + c.au.split('|').length + ' Messpunkte)' : '—' },
    ];

    var html = '';

    if (hash) {
        html += '<div class="fp-hash-block">'
              + '<div class="fp-hash-label">SHA-256 · Gerätefingerabdruck</div>'
              + '<div class="fp-hash-val">' + hashLine1 + '\n' + hashLine2 + '</div>'
              + '</div>';
    }

    html += '<div class="fp-components">';
    for (var j = 0; j < rows.length; j++) {
        html += '<div class="fp-row">'
              + '<span class="fp-key">' + rows[j].key + '</span>'
              + '<span class="fp-val">' + escHtml(String(rows[j].val)) + '</span>'
              + '</div>';
    }
    html += '</div>';

    container.innerHTML = html;

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
}());
</script>

</body>
</html>
